<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A crowded airport departure gate">
  <!-- wall and floor -->
  <rect width="800" height="500" fill="#e7e3da"/>
  <rect y="330" width="800" height="170" fill="#b9b3a6"/>
  <g stroke="#a59f92" stroke-width="2"><line x1="0" y1="380" x2="800" y2="380"/><line x1="0" y1="440" x2="800" y2="440"/></g>

  <!-- big window with snow -->
  <rect x="300" y="30" width="480" height="260" fill="#59677a"/>
  <rect x="300" y="230" width="480" height="60" fill="#eef2f6"/>
  <g fill="#eef2f6">
    <path d="M520 205 h170 l30 -14 h-12 l-40 14 h-40 l-20 -40 h-14 l8 40 h-82 z" opacity="0.9"/>
    <rect x="510" y="200" width="200" height="14" rx="7"/>
  </g>
  <g fill="#fff">
    <circle cx="320" cy="50" r="3"/><circle cx="350" cy="90" r="4"/><circle cx="380" cy="60" r="3"/><circle cx="410" cy="120" r="4"/>
    <circle cx="440" cy="45" r="3"/><circle cx="470" cy="100" r="4"/><circle cx="500" cy="70" r="3"/><circle cx="530" cy="140" r="4"/>
    <circle cx="560" cy="55" r="3"/><circle cx="590" cy="110" r="4"/><circle cx="620" cy="80" r="3"/><circle cx="650" cy="150" r="4"/>
    <circle cx="680" cy="50" r="3"/><circle cx="710" cy="120" r="4"/><circle cx="740" cy="70" r="3"/><circle cx="765" cy="140" r="4"/>
    <circle cx="335" cy="160" r="4"/><circle cx="365" cy="200" r="3"/><circle cx="395" cy="170" r="3"/><circle cx="455" cy="180" r="4"/>
    <circle cx="485" cy="210" r="3"/><circle cx="545" cy="180" r="3"/><circle cx="605" cy="170" r="4"/><circle cx="635" cy="215" r="3"/>
    <circle cx="695" cy="180" r="3"/><circle cx="725" cy="210" r="4"/><circle cx="755" cy="185" r="3"/><circle cx="425" cy="220" r="3"/>
  </g>
  <g fill="none" stroke="#9aa3ad" stroke-width="8">
    <rect x="300" y="30" width="480" height="260"/>
    <line x1="460" y1="30" x2="460" y2="290"/><line x1="620" y1="30" x2="620" y2="290"/>
  </g>

  <!-- departure board -->
  <rect x="30" y="30" width="240" height="150" rx="6" fill="#1d2430"/>
  <text x="150" y="54" fill="#ffd34d" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">DEPARTURES</text>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="bold">
    <text x="45" y="82" fill="#fff">CALGARY</text><text x="255" y="82" fill="#ff5a4e" text-anchor="end">DELAYED</text>
    <text x="45" y="106" fill="#fff">HALIFAX</text><text x="255" y="106" fill="#ff5a4e" text-anchor="end">DELAYED</text>
    <text x="45" y="130" fill="#fff">VANCOUVER</text><text x="255" y="130" fill="#ff5a4e" text-anchor="end">DELAYED</text>
    <text x="45" y="154" fill="#fff">WINNIPEG</text><text x="255" y="154" fill="#7ee08a" text-anchor="end">ON TIME</text>
  </g>

  <!-- gate sign -->
  <rect x="30" y="195" width="70" height="36" rx="4" fill="#ffd34d"/>
  <text x="65" y="220" fill="#1d2430" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">B12</text>

  <!-- gate agent at podium with microphone -->
  <g>
    <circle cx="160" cy="232" r="15" fill="#c48a62"/>
    <path d="M145 230 q15 -24 30 0 q-4 -6 -15 -8 q-11 2 -15 8 z" fill="#2a1d14"/>
    <rect x="144" y="246" width="32" height="40" rx="8" fill="#1f3c6e"/>
    <path d="M154 248 l6 10 l6 -10" fill="#d1352b"/>
    <line x1="176" y1="258" x2="190" y2="244" stroke="#c48a62" stroke-width="6" stroke-linecap="round"/>
    <line x1="192" y1="242" x2="174" y2="232" stroke="#333" stroke-width="3"/>
    <circle cx="173" cy="231" r="4" fill="#333"/>
    <rect x="120" y="270" width="90" height="70" fill="#5a6474"/>
    <rect x="120" y="270" width="90" height="10" fill="#3d4553"/>
    <g fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round">
      <path d="M182 220 q8 4 8 14"/><path d="M188 212 q14 8 12 26"/>
    </g>
  </g>

  <!-- line of passengers -->
  <g>
    <rect x="232" y="268" width="28" height="56" rx="8" fill="#8e5bb0"/><circle cx="246" cy="254" r="12" fill="#e8b88f"/>
    <path d="M234 252 q12 -18 24 0 z" fill="#b5651d"/>
    <line x1="240" y1="324" x2="240" y2="350" stroke="#333" stroke-width="7"/><line x1="252" y1="324" x2="252" y2="350" stroke="#333" stroke-width="7"/>
    <rect x="268" y="264" width="28" height="60" rx="8" fill="#4a8a5a"/><circle cx="282" cy="250" r="12" fill="#8d5a3b"/>
    <path d="M270 248 q12 -16 24 0 z" fill="#111"/>
    <line x1="276" y1="324" x2="276" y2="350" stroke="#444" stroke-width="7"/><line x1="288" y1="324" x2="288" y2="350" stroke="#444" stroke-width="7"/>
    <rect x="304" y="270" width="28" height="54" rx="8" fill="#c0703a"/><circle cx="318" cy="256" r="12" fill="#f0c8a0"/>
    <path d="M306 254 q12 -18 24 0 v8 h-4 v-6 h-16 v6 h-4 z" fill="#d9b44a"/>
    <line x1="312" y1="324" x2="312" y2="350" stroke="#2c3e66" stroke-width="7"/><line x1="324" y1="324" x2="324" y2="350" stroke="#2c3e66" stroke-width="7"/>
    <rect x="338" y="300" width="22" height="36" rx="4" fill="#2c6d8f"/><line x1="349" y1="300" x2="349" y2="288" stroke="#555" stroke-width="3"/>
  </g>

  <!-- row of seats -->
  <rect x="380" y="372" width="400" height="10" fill="#555c66"/>
  <g fill="#2f6fa8">
    <rect x="385" y="330" width="60" height="44" rx="6"/><rect x="450" y="330" width="60" height="44" rx="6"/>
    <rect x="515" y="330" width="60" height="44" rx="6"/><rect x="580" y="330" width="60" height="44" rx="6"/>
    <rect x="645" y="330" width="60" height="44" rx="6"/><rect x="710" y="330" width="60" height="44" rx="6"/>
  </g>
  <g fill="#555c66"><rect x="400" y="382" width="8" height="40"/><rect x="740" y="382" width="8" height="40"/></g>

  <!-- businessman with laptop and spilling coffee (front left seat) -->
  <g>
    <rect x="395" y="300" width="40" height="52" rx="10" fill="#2b2f38"/>
    <path d="M410 302 l5 12 l5 -12" fill="#fff"/><line x1="415" y1="306" x2="415" y2="330" stroke="#b22222" stroke-width="4"/>
    <circle cx="415" cy="284" r="15" fill="#e2b48a"/>
    <path d="M400 282 q15 -22 30 0 z" fill="#6b4b2e"/>
    <rect x="398" y="346" width="40" height="10" fill="#2b2f38"/>
    <line x1="405" y1="356" x2="400" y2="395" stroke="#2b2f38" stroke-width="9"/><line x1="428" y1="356" x2="430" y2="395" stroke="#2b2f38" stroke-width="9"/>
    <!-- laptop -->
    <polygon points="430,345 470,345 466,350 434,350" fill="#9aa3ad"/>
    <polygon points="440,314 472,314 470,345 438,345" fill="#c9d1da" stroke="#9aa3ad" stroke-width="2"/>
    <line x1="430" y1="330" x2="445" y2="342" stroke="#e2b48a" stroke-width="6" stroke-linecap="round"/>
    <!-- tipped cup and spill on the seat beside him -->
    <g transform="rotate(80 478 360)">
      <polygon points="470,350 486,350 484,372 472,372" fill="#fff" stroke="#999" stroke-width="1.5"/>
      <rect x="470" y="356" width="16" height="6" fill="#8b5a2b"/>
    </g>
    <path d="M488 368 q20 -4 40 4 q8 6 -4 8 q-22 4 -36 -4 z" fill="#6f4520"/>
    <g fill="#6f4520"><circle cx="500" cy="388" r="3"/><circle cx="514" cy="396" r="2.5"/></g>
  </g>

  <!-- family with three kids asleep across seats -->
  <g>
    <!-- parent -->
    <rect x="720" y="296" width="38" height="56" rx="10" fill="#b5524b"/>
    <circle cx="739" cy="280" r="15" fill="#8d5a3b"/>
    <path d="M724 282 q2 -26 30 0 q-2 -10 -15 -12 q-13 2 -15 12 z" fill="#1f1a17"/>
    <g fill="none" stroke="#333" stroke-width="2"><path d="M731 280 q3 2 6 0"/><path d="M741 280 q3 2 6 0"/></g>
    <!-- kids lying across seats -->
    <rect x="533" y="318" width="44" height="22" rx="10" fill="#e66aa0"/><circle cx="524" cy="326" r="10" fill="#c48a62"/>
    <path d="M515 322 q9 -12 18 0 z" fill="#111"/>
    <rect x="597" y="318" width="44" height="22" rx="10" fill="#f2b632"/><circle cx="588" cy="326" r="10" fill="#f0c8a0"/>
    <path d="M579 322 q9 -12 18 0 z" fill="#8a4f1d"/>
    <rect x="661" y="318" width="46" height="22" rx="10" fill="#3fa36b"/><circle cx="652" cy="326" r="10" fill="#e2b48a"/>
    <path d="M643 322 q9 -12 18 0 z" fill="#2a1d14"/>
    <g fill="none" stroke="#333" stroke-width="1.8"><path d="M520 327 q3 2 6 0"/><path d="M584 327 q3 2 6 0"/><path d="M648 327 q3 2 6 0"/></g>
    <!-- Zzz -->
    <g font-family="Arial, sans-serif" font-weight="bold" fill="#4a5a7a">
      <text x="535" y="304" font-size="14">z</text><text x="547" y="292" font-size="18">Z</text>
      <text x="600" y="304" font-size="14">z</text><text x="612" y="292" font-size="18">Z</text>
      <text x="664" y="304" font-size="14">z</text><text x="676" y="292" font-size="18">Z</text>
      <text x="770" y="268" font-size="14">z</text>
    </g>
  </g>

  <!-- young woman running with a broken suitcase -->
  <g>
    <rect x="168" y="388" width="30" height="46" rx="9" fill="#e04a3f" transform="rotate(-12 183 410)"/>
    <circle cx="190" cy="374" r="13" fill="#f0c8a0"/>
    <path d="M178 372 q10 -18 24 -2 q8 2 16 -6 q-2 14 -16 12 z" fill="#c2702e"/>
    <line x1="178" y1="430" x2="155" y2="460" stroke="#2c3e66" stroke-width="8" stroke-linecap="round"/>
    <line x1="192" y1="430" x2="215" y2="458" stroke="#2c3e66" stroke-width="8" stroke-linecap="round"/>
    <line x1="196" y1="400" x2="222" y2="410" stroke="#f0c8a0" stroke-width="6" stroke-linecap="round"/>
    <line x1="172" y1="400" x2="150" y2="412" stroke="#f0c8a0" stroke-width="6" stroke-linecap="round"/>
    <!-- suitcase tilted, one wheel missing -->
    <line x1="222" y1="410" x2="246" y2="422" stroke="#555" stroke-width="3"/>
    <rect x="238" y="420" width="52" height="38" rx="5" fill="#2a7f8f" transform="rotate(14 264 439)"/>
    <circle cx="245" cy="462" r="5" fill="#222"/>
    <circle cx="318" cy="470" r="5" fill="#222"/>
    <g stroke="#7a7466" stroke-width="2" stroke-linecap="round"><line x1="300" y1="472" x2="308" y2="472"/><line x1="296" y1="464" x2="304" y2="466"/></g>
    <g stroke="#7a7466" stroke-width="2.5" stroke-linecap="round"><line x1="120" y1="395" x2="140" y2="395"/><line x1="115" y1="410" x2="140" y2="410"/><line x1="122" y1="425" x2="142" y2="425"/></g>
  </g>
</svg>
