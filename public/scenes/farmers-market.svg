<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A busy outdoor farmers' market">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fd6f5"/>
      <stop offset="0.6" stop-color="#b9def2"/>
      <stop offset="1" stop-color="#7d8794"/>
    </linearGradient>
    <pattern id="stripe" width="24" height="10" patternUnits="userSpaceOnUse">
      <rect width="12" height="10" fill="#e04a3f"/>
      <rect x="12" width="12" height="10" fill="#fff"/>
    </pattern>
  </defs>

  <!-- sky, sun, storm clouds -->
  <rect width="800" height="300" fill="url(#sky)"/>
  <circle cx="90" cy="70" r="38" fill="#ffd34d"/>
  <g stroke="#ffd34d" stroke-width="5" stroke-linecap="round">
    <line x1="90" y1="15" x2="90" y2="2"/><line x1="145" y1="70" x2="158" y2="70"/>
    <line x1="35" y1="70" x2="22" y2="70"/><line x1="129" y1="31" x2="138" y2="22"/>
    <line x1="51" y1="31" x2="42" y2="22"/><line x1="129" y1="109" x2="138" y2="118"/>
  </g>
  <g fill="#4d5562">
    <ellipse cx="640" cy="60" rx="90" ry="38"/>
    <ellipse cx="720" cy="80" rx="90" ry="40"/>
    <ellipse cx="560" cy="85" rx="70" ry="30"/>
    <ellipse cx="770" cy="45" rx="60" ry="30"/>
  </g>
  <g fill="#5f6876">
    <ellipse cx="610" cy="45" rx="60" ry="25"/>
    <ellipse cx="700" cy="40" rx="55" ry="24"/>
  </g>
  <polyline points="690,110 675,140 692,140 672,175" fill="none" stroke="#ffe066" stroke-width="5" stroke-linejoin="round"/>

  <!-- distant trees and ground -->
  <g fill="#6fae5c">
    <circle cx="20" cy="250" r="45"/><circle cx="780" cy="245" r="50"/><circle cx="380" cy="240" r="40"/>
  </g>
  <rect y="270" width="800" height="230" fill="#d9cdb8"/>
  <rect y="270" width="800" height="8" fill="#c4b79f"/>

  <!-- tents -->
  <g>
    <polygon points="40,150 230,150 250,190 20,190" fill="url(#stripe)"/>
    <rect x="30" y="190" width="6" height="110" fill="#7a5a3a"/><rect x="234" y="190" width="6" height="110" fill="#7a5a3a"/>
  </g>
  <g>
    <polygon points="290,140 500,140 520,185 270,185" fill="#f2b632"/>
    <polygon points="290,140 500,140 395,110" fill="#e39b14"/>
    <rect x="280" y="185" width="6" height="115" fill="#7a5a3a"/><rect x="504" y="185" width="6" height="115" fill="#7a5a3a"/>
  </g>
  <g>
    <polygon points="560,165 740,165 760,200 540,200" fill="#3f8fd6"/>
    <rect x="550" y="200" width="6" height="100" fill="#7a5a3a"/><rect x="744" y="200" width="6" height="100" fill="#7a5a3a"/>
  </g>

  <!-- veg stall under red tent -->
  <rect x="45" y="245" width="180" height="55" fill="#a8763e"/>
  <g fill="#3e9b48"><circle cx="70" cy="242" r="12"/><circle cx="92" cy="240" r="12"/><circle cx="114" cy="242" r="12"/></g>
  <g fill="#f08a24"><rect x="150" y="232" width="8" height="18" rx="4"/><rect x="162" y="230" width="8" height="20" rx="4"/><rect x="174" y="232" width="8" height="18" rx="4"/><rect x="186" y="231" width="8" height="19" rx="4"/></g>

  <!-- apple vendor under yellow tent -->
  <g>
    <!-- vendor -->
    <rect x="370" y="195" width="44" height="60" rx="10" fill="#2f7d4a"/>
    <rect x="378" y="205" width="28" height="40" fill="#f4efe2"/>
    <circle cx="392" cy="180" r="16" fill="#c98c5a"/>
    <path d="M376 176 q16 -22 32 0 z" fill="#3b2a1e"/>
    <line x1="410" y1="215" x2="440" y2="232" stroke="#c98c5a" stroke-width="8" stroke-linecap="round"/>
    <!-- table and crates -->
    <rect x="300" y="250" width="200" height="50" fill="#a8763e"/>
    <rect x="310" y="235" width="50" height="22" fill="#8a5c2c"/>
    <g fill="#d6332b"><circle cx="320" cy="234" r="7"/><circle cx="335" cy="232" r="7"/><circle cx="350" cy="234" r="7"/><circle cx="328" cy="226" r="7"/><circle cx="343" cy="226" r="7"/></g>
    <!-- scale -->
    <rect x="432" y="240" width="40" height="12" fill="#888"/>
    <rect x="448" y="222" width="8" height="20" fill="#888"/>
    <path d="M428 222 h48 l-6 10 h-36 z" fill="#bbb"/>
    <g fill="#d6332b"><circle cx="444" cy="218" r="6"/><circle cx="456" cy="216" r="6"/><circle cx="462" cy="220" r="6"/></g>
    <!-- elderly woman with shopping cart -->
    <rect x="512" y="285" width="34" height="38" rx="4" fill="#7c4a9e"/>
    <rect x="512" y="285" width="34" height="6" fill="#5e3779"/>
    <circle cx="518" cy="328" r="6" fill="#333"/><circle cx="540" cy="328" r="6" fill="#333"/>
    <line x1="546" y1="287" x2="560" y2="262" stroke="#555" stroke-width="4"/>
    <path d="M565 240 q-4 50 4 80 h26 q6 -30 -2 -80 z" fill="#b5524b"/>
    <circle cx="580" cy="226" r="15" fill="#e8b88f"/>
    <path d="M565 224 q15 -24 30 0 q2 -14 -15 -17 q-17 3 -15 17 z" fill="#d9d9d9"/>
    <circle cx="566" cy="230" r="5" fill="#d9d9d9"/>
    <line x1="570" y1="260" x2="558" y2="264" stroke="#e8b88f" stroke-width="7" stroke-linecap="round"/>
    <line x1="575" y1="320" x2="573" y2="345" stroke="#555" stroke-width="7"/><line x1="588" y1="320" x2="590" y2="345" stroke="#555" stroke-width="7"/>
    <line x1="600" y1="260" x2="610" y2="300" stroke="#8a6a40" stroke-width="4"/>
  </g>

  <!-- street musician -->
  <g>
    <rect x="80" y="330" width="40" height="60" rx="10" fill="#2c5d8f"/>
    <circle cx="100" cy="314" r="16" fill="#8d5a3b"/>
    <path d="M84 310 q16 -20 32 0 v-6 q-16 -14 -32 0 z" fill="#222"/>
    <rect x="82" y="298" width="36" height="7" rx="3" fill="#222"/>
    <line x1="92" y1="390" x2="88" y2="430" stroke="#333" stroke-width="9"/><line x1="108" y1="390" x2="112" y2="430" stroke="#333" stroke-width="9"/>
    <!-- guitar -->
    <ellipse cx="112" cy="372" rx="20" ry="16" fill="#c27a2c" transform="rotate(-25 112 372)"/>
    <circle cx="112" cy="372" r="5" fill="#4a2a10"/>
    <line x1="122" y1="364" x2="165" y2="335" stroke="#6b3e17" stroke-width="6"/>
    <line x1="88" y1="345" x2="110" y2="370" stroke="#8d5a3b" stroke-width="7" stroke-linecap="round"/>
    <!-- music notes -->
    <g fill="#333"><circle cx="160" cy="300" r="4"/><rect x="163" y="282" width="2" height="18"/><circle cx="178" cy="290" r="4"/><rect x="181" y="272" width="2" height="18"/></g>
    <!-- open case with coins -->
    <path d="M60 445 h90 l-6 18 h-78 z" fill="#3a2a20"/>
    <rect x="66" y="440" width="78" height="8" fill="#a3242b"/>
    <g fill="#e5c13b"><circle cx="85" cy="443" r="4"/><circle cx="102" cy="444" r="4"/><circle cx="120" cy="442" r="4"/></g>
  </g>

  <!-- child dropping ice cream, dog running -->
  <g>
    <rect x="262" y="370" width="28" height="38" rx="8" fill="#f06aa0"/>
    <circle cx="276" cy="355" r="13" fill="#f0c8a0"/>
    <path d="M263 352 q13 -18 26 0 z" fill="#c2702e"/>
    <path d="M270 360 q6 -4 12 0" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="270" y1="408" x2="268" y2="435" stroke="#3a5a9a" stroke-width="7"/><line x1="282" y1="408" x2="284" y2="435" stroke="#3a5a9a" stroke-width="7"/>
    <line x1="288" y1="380" x2="304" y2="368" stroke="#f0c8a0" stroke-width="6" stroke-linecap="round"/>
    <!-- falling cone -->
    <g transform="rotate(150 318 405)">
      <polygon points="310,400 326,400 318,422" fill="#d9a35b"/>
      <circle cx="318" cy="396" r="9" fill="#f7d6e0"/>
    </g>
    <g stroke="#999" stroke-width="2"><line x1="306" y1="378" x2="310" y2="388"/><line x1="314" y1="376" x2="316" y2="386"/></g>
    <!-- dog -->
    <ellipse cx="385" cy="430" rx="32" ry="14" fill="#a8672e"/>
    <circle cx="352" cy="418" r="13" fill="#a8672e"/>
    <ellipse cx="340" cy="422" rx="8" ry="5" fill="#a8672e"/>
    <ellipse cx="358" cy="408" rx="5" ry="9" fill="#6e3f18" transform="rotate(25 358 408)"/>
    <circle cx="348" cy="415" r="2" fill="#111"/>
    <line x1="365" y1="440" x2="350" y2="455" stroke="#a8672e" stroke-width="6" stroke-linecap="round"/>
    <line x1="375" y1="440" x2="380" y2="458" stroke="#a8672e" stroke-width="6" stroke-linecap="round"/>
    <line x1="400" y1="440" x2="390" y2="458" stroke="#a8672e" stroke-width="6" stroke-linecap="round"/>
    <line x1="410" y1="438" x2="425" y2="452" stroke="#a8672e" stroke-width="6" stroke-linecap="round"/>
    <path d="M416 424 q14 -10 18 -24" fill="none" stroke="#a8672e" stroke-width="5" stroke-linecap="round"/>
    <g stroke="#9a8f7c" stroke-width="2" stroke-linecap="round"><line x1="430" y1="420" x2="450" y2="420"/><line x1="432" y1="432" x2="456" y2="432"/></g>
  </g>

  <!-- bicycle rack and arguing couple -->
  <g>
    <g fill="none" stroke="#666" stroke-width="5">
      <path d="M600 470 v-30 a12 12 0 0 1 24 0 v30"/><path d="M640 470 v-30 a12 12 0 0 1 24 0 v30"/><path d="M680 470 v-30 a12 12 0 0 1 24 0 v30"/>
    </g>
    <g fill="none" stroke="#2a7f8f" stroke-width="4">
      <circle cx="612" cy="452" r="18"/><circle cx="668" cy="452" r="18"/>
      <path d="M612 452 l20 -26 h26 l10 26 M632 426 l14 26 l22 0"/>
    </g>
    <!-- man -->
    <rect x="640" y="330" width="36" height="58" rx="9" fill="#d65a2c"/>
    <circle cx="658" cy="314" r="15" fill="#e2b48a"/>
    <path d="M644 310 q14 -20 28 0 z" fill="#5a3a22"/>
    <path d="M652 320 q6 -4 12 0" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="676" y1="345" x2="700" y2="320" stroke="#e2b48a" stroke-width="7" stroke-linecap="round"/>
    <!-- woman -->
    <path d="M718 330 q-4 34 2 60 h34 q6 -26 0 -60 z" fill="#3a8a5a"/>
    <circle cx="736" cy="314" r="15" fill="#c48a62"/>
    <path d="M720 316 q2 -26 32 -4 q4 16 -2 28 q-2 -18 -14 -22 q-12 4 -16 -2 z" fill="#1f1a17"/>
    <path d="M729 322 q7 -4 14 0" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="720" y1="350" x2="706" y2="340" stroke="#c48a62" stroke-width="7" stroke-linecap="round"/>
    <!-- map held between them -->
    <polygon points="690,315 716,322 714,350 686,342" fill="#f3ead2" stroke="#9a8a62" stroke-width="2"/>
    <path d="M694 325 l8 6 l6 -4 l4 8" fill="none" stroke="#3a7ac2" stroke-width="2"/>
    <!-- argument marks -->
    <g fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round">
      <path d="M680 296 l6 -12 l4 10 l6 -12"/><path d="M724 290 l6 -10 l4 9 l6 -11"/>
    </g>
  </g>
</svg>
